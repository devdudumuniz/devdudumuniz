<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Eduardo Muniz — Systems, AI and Infrastructure</title>
  <desc id="desc">Identidade visual tipográfica de Eduardo Muniz sem fotografia.</desc>
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brandLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="75%" stop-color="#7c3aed" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(76 35)">
    <path d="M54 0 108 31v62l-54 31L0 93V31Z" fill="none" stroke="url(#brand)" stroke-width="5"/>
    <path d="M24 34v51l30 17 30-17V34L54 51Z" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="m24 34 30 17 30-17" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="76" r="6" fill="#22d3ee"/>
  </g>

  <text x="230" y="104" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="57" font-weight="800" letter-spacing="1.5">EDUARDO</text>
  <text x="515" y="104" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="57" font-weight="800" letter-spacing="1.5">MUNIZ</text>

  <g transform="translate(712 58)">
    <rect width="104" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="52" y="25" fill="#f0f6fc" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">TECH</text>
  </g>

  <text x="233" y="139" fill="#8b949e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" letter-spacing="3">SYSTEMS  ·  APPLIED AI  ·  INFRASTRUCTURE</text>

  <line x1="230" y1="165" x2="822" y2="165" stroke="url(#brandLine)" stroke-width="2"/>
  <text x="233" y="193" fill="#6e7681" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5">FOUNDER · SYSTEMS ARCHITECT · OPEN SOURCE</text>
</svg>
